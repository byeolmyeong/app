    </g>
    <text class="serif" font-size="27" font-weight="700" fill="#15161A"><tspan x="28" y="218">생각나면 바로</tspan><tspan x="28" y="256">해 보고, 마음은</tspan><tspan x="28" y="294">멀리 두는 사람</tspan></text>
    <line x1="28" y1="328" x2="316" y2="328" stroke="#15161A"/>

    <text x="316" y="360" class="mono" font-size="10" fill="#77736A" text-anchor="end">태양 · 양 19° · 3H</text>
    <text font-size="14" fill="#2A2A2E"><tspan x="28" y="388">떠오른 생각을 오래 묵히지 못해요.</tspan><tspan x="28" y="410">말로 꺼내고 일단 해 봐야 다음이</tspan><tspan x="28" y="432">보이는 쪽이에요.</tspan></text>

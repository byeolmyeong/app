    <text x="28" y="598" font-size="12" font-weight="700" fill="#C8822E">해 볼 만한 것 · 이성</text>
    <text font-size="13" fill="#2A2A2E"><tspan x="28" y="624"><tspan class="mono" fill="#77736A">1 </tspan> 마음에 드는 사람에게 먼저 질문하기</tspan><tspan x="28" y="646"><tspan class="mono" fill="#77736A">2 </tspan> 하고 싶은 말을 미루지 않기</tspan><tspan x="28" y="668"><tspan class="mono" fill="#77736A">3 </tspan> 혼자만의 시간도 일정에 넣기</tspan></text>
